# Local stores for the Mocha integration suites. Mirrors the images and ports CI uses.
# Works with Docker or Podman (podman-compose):
#   docker compose up -d && npm run test:mocha:local      # or: podman compose up -d
#   docker compose down -v                                # or: podman compose down -v
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mongo:
    image: mongo:8
    ports: ["27017:27017"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
